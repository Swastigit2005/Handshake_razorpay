# One-click deploy on Render (Blueprint). The console runs offline and
# reproducibly with no keys; add them as environment variables to switch the
# live backends on.
#
# Free instances have an ephemeral filesystem, so the console imports the
# canonical run committed in runs/ on every startup and re-verifies its hash
# chain. Free instances also spin down after 15 minutes idle and take about a
# minute to wake — point an uptime pinger at /healthz every 10 minutes if the
# URL is going to a reviewer.
services:
  - type: web
    name: handshake-console
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install ".[console,postgres]"
    startCommand: python -m uvicorn handshake.server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: HS_PAYMENTS
        value: sim
      - key: HS_BUYERS
        value: heuristic
      - key: HS_DEMO_MODE
        value: "1"
      # Runs, journeys and ledgers live in Postgres and survive redeploys.
      - key: DATABASE_URL
        fromDatabase:
          name: handshake-db
          property: connectionString
      - key: HS_TRUST_PROXY
        value: "1"
      # Shopify: set these in the Render dashboard; sync: false keeps them out
      # of the repository and makes Render ask for them.
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      # Live plane. The admin token creates real merchants over /v1/merchants;
      # Render generates it once and shows it in the dashboard. The sandbox
      # demo (/demo, the sandbox dashboard login) is on for a public demo URL;
      # set HS_DEMO_SANDBOX=0 on any deployment that holds real merchants.
      - key: HS_ADMIN_TOKEN
        generateValue: true
      - key: HS_DEMO_SANDBOX
        value: "1"

databases:
  - name: handshake-db
    databaseName: handshake
    plan: free
    region: singapore
    postgresMajorVersion: "16"
