[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handshake"
version = "1.0.0"
description = "Revenue recovery and readiness scanning for agent-driven checkout"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pranamya" }]
keywords = ["agentic-commerce", "razorpay", "revenue-recovery", "acp", "uap"]

# The batch runner and the scan need nothing beyond the standard library.
dependencies = []

[project.optional-dependencies]
console = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
live = ["razorpay>=1.4", "openai>=1.40"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = [
  "fastapi>=0.110", "uvicorn[standard]>=0.27",
  "razorpay>=1.4", "openai>=1.40", "anthropic>=0.40",
  "pytest>=8.0", "httpx>=0.27",
]

[project.scripts]
handshake-batch = "handshake.experiments.run:main"
handshake-scan = "handshake.readiness.run:main"

[tool.setuptools.packages.find]
include = ["handshake*"]

[tool.pytest.ini_options]
testpaths = ["handshake/tests"]
addopts = "-q"
